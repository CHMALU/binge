image: node:22

stages:
  - build
  - analysis
  - dependency_scan
  - test
  - deploy

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH'

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

.default_node_job:
  before_script:
    - npm ci --cache .npm --prefer-offline
    - npx prisma generate
    - echo "[INFO] Starting pipeline for $CI_COMMIT_BRANCH"

build:
  extends: .default_node_job
  stage: build
  script:
    - echo "[INFO] Building project..."
    - npm run build

lint:
  extends: .default_node_job
  stage: analysis
  script:
    - npm run lint

typecheck:
  extends: .default_node_job
  stage: analysis
  script:
    - npm run typecheck

npm_audit:
  extends: .default_node_job
  stage: dependency_scan
  script:
    - npm audit --audit-level=high

fast_tests:
  extends: .default_node_job
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH != "main"'
  script:
    - npm run test:fast
  coverage: '/All files[^|]*\|[^|]*\s+([0-9.]+)/'

full_tests:
  extends: .default_node_job
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - npm run test:full -- --coverageThreshold='{"global":{"branches":70,"functions":70,"lines":80,"statements":80}}'
  coverage: '/All files[^|]*\|[^|]*\s+([0-9.]+)/'

mock_deploy:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "[MOCK] This is a mock deployment!"
